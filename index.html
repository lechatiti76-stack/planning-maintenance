<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Planification et suivi de la maintenance des installations LHTE : demandes, programme hebdomadaire, théorique / réel, délais entre contrôles, graissage.">
<meta name="theme-color" content="#0e1b36">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maintenance">
<title>Planning Maintenance LHTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : « tableau de poste » — bandeau marine fixe, tableaux de service clairs, plaques carrées colorées par famille d'équipement. */
:root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --line: #d8dee7;
  --line-2: #e8ecf1;
  --ink: #101827;
  --ink-2: #485365;
  --ink-3: #828da0;
  --accent: #1d4ed8;
  --accent-soft: #e3ebfd;
  --accent-ink: #ffffff;
  --band: #0e1b36;
  --band-2: #1a2b50;
  --band-ink: #e7edf8;
  --band-ink-2: #9fb0cf;
  --ok: #15803d; --ok-bg: #dcf3e3;
  --info: #1d4ed8; --info-bg: #dfe8fc;
  --warn: #a35a06; --warn-bg: #fdefd2;
  --bad: #b91c1c; --bad-bg: #fbe1e1;
  --vio: #6d28d9; --vio-bg: #ece6fd;
  --mute: #5f6b7d; --mute-bg: #e9edf2;
  --s-prevu: #9aa6b8; --s-prog: #2f6ae6; --s-real: #1f9d55; --s-dem: #8b5cf6;
  --or: #c2410c; --or-bg: #fde4d3;
  --shadow: 0 1px 2px rgba(16, 24, 39, .06), 0 8px 24px -16px rgba(16, 24, 39, .28);
  --font-d: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-b: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-m: "IBM Plex Mono", ui-monospace, Consolas, "Liberation Mono", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1120; --surface: #111a2c; --surface-2: #16213a; --line: #26344f; --line-2: #1d2942;
    --ink: #e8edf6; --ink-2: #aab5c8; --ink-3: #6f7d96;
    --accent: #6c9cff; --accent-soft: #1b2b52; --accent-ink: #0a1120;
    --band: #060c19; --band-2: #14213e; --band-ink: #e1e8f5; --band-ink-2: #8796b3;
    --ok: #4ade80; --ok-bg: rgba(74, 222, 128, .14); --info: #7aa7ff; --info-bg: rgba(122, 167, 255, .15);
    --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .14); --bad: #f87171; --bad-bg: rgba(248, 113, 113, .15);
    --vio: #b69bff; --vio-bg: rgba(182, 155, 255, .15); --mute: #a3afc3; --mute-bg: rgba(163, 175, 195, .12);
    --s-prevu: #5d6b84; --s-prog: #5b8cff; --s-real: #34c26f; --s-dem: #a78bfa; --or: #fb923c; --or-bg: rgba(251, 146, 60, .15);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1120; --surface: #111a2c; --surface-2: #16213a; --line: #26344f; --line-2: #1d2942;
  --ink: #e8edf6; --ink-2: #aab5c8; --ink-3: #6f7d96;
  --accent: #6c9cff; --accent-soft: #1b2b52; --accent-ink: #0a1120;
  --band: #060c19; --band-2: #14213e; --band-ink: #e1e8f5; --band-ink-2: #8796b3;
  --ok: #4ade80; --ok-bg: rgba(74, 222, 128, .14); --info: #7aa7ff; --info-bg: rgba(122, 167, 255, .15);
  --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .14); --bad: #f87171; --bad-bg: rgba(248, 113, 113, .15);
  --vio: #b69bff; --vio-bg: rgba(182, 155, 255, .15); --mute: #a3afc3; --mute-bg: rgba(163, 175, 195, .12);
  --s-prevu: #5d6b84; --s-prog: #5b8cff; --s-real: #34c26f; --s-dem: #a78bfa; --or: #fb923c; --or-bg: rgba(251, 146, 60, .15);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-d); font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .82rem; }

/* ---- bandeau ---- */
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.band-inner { max-width: 1500px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band-top { display: flex; align-items: center; gap: 14px; padding-block: 10px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-plate { width: 26px; height: 26px; border-radius: 3px; background: #7c3aed; box-shadow: inset 0 0 0 3px var(--band), inset 0 0 0 5px #b79cff; flex: none; }
.brand-name { font-family: var(--font-d); font-weight: 700; font-size: 1.22rem; letter-spacing: .02em; white-space: nowrap; }
.brand-site { font-family: var(--font-m); font-size: .78rem; color: var(--band-ink-2); border: 1px solid var(--band-2); border-radius: 4px; padding: 1px 6px; }
.band-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.clock { font-family: var(--font-m); font-size: .82rem; color: var(--band-ink-2); white-space: nowrap; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--band-ink-2); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: block; }
.sync.ok i { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }
.sync.local i { background: #fbbf24; }
.sync.err i { background: #f87171; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; color: var(--band-ink-2); padding: 10px 12px 11px; font-family: var(--font-d); font-weight: 600; font-size: .98rem; letter-spacing: .02em; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
.nav button:hover { color: var(--band-ink); }
.nav button[aria-current="page"] { color: var(--band-ink); border-bottom-color: #8fb0ff; }
.btn-new { background: #2f6ae6; color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-new:hover { background: #3d78f2; }
.btn-pdf { background: #fff; color: #0e1b36; border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-pdf:hover { background: #e3ebfd; }

/* ---- page ---- */
.page { max-width: 1500px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; align-items: flex-end; gap: 12px 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 1.7rem; line-height: 1.1; }
.page-head .sub { color: var(--ink-2); font-size: .92rem; }
.page-head .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel-h h2 { font-size: 1.08rem; }
.panel-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-b { padding: 14px; }
.eyebrow { font-family: var(--font-d); font-weight: 600; font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 18px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: .88rem; }

/* ---- boutons & champs ---- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 7px 12px; min-height: 36px; font-weight: 600; font-size: .88rem; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { min-height: 30px; padding: 4px 9px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 11px; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], input:not([type]), select, textarea {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-height: 36px; width: 100%; min-width: 0; color: var(--ink);
}
textarea { min-height: 80px; resize: vertical; font-family: var(--font-m); font-size: .82rem; }
input[type="color"] { width: 44px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px 12px; }
.form-grid .wide { grid-column: 1 / -1; }
.nav-week { display: inline-flex; align-items: center; gap: 4px; }
.nav-week .label { font-family: var(--font-d); font-weight: 700; font-size: 1.05rem; padding: 0 6px; white-space: nowrap; }

/* ---- plaques et pastilles ---- */
.plate { display: inline-block; width: 12px; height: 12px; border-radius: 2px; flex: none; vertical-align: -1px; background: var(--c, #64748b); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
.tcell { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: .84rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: .76rem; font-weight: 600; white-space: nowrap; line-height: 1.5; }
.pill b { font-weight: 700; font-family: var(--font-m); font-size: .72rem; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.vio { background: var(--vio-bg); color: var(--vio); }
.pill.mute { background: var(--mute-bg); color: var(--mute); }
.pill.or { background: var(--or-bg); color: var(--or); }
.ecart { font-family: var(--font-m); font-size: .8rem; font-weight: 600; }
.ecart.avance { color: var(--info); } .ecart.delai { color: var(--ok); } .ecart.retard { color: var(--warn); } .ecart.grave { color: var(--bad); }

/* ---- KPI ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; text-align: left; box-shadow: var(--shadow); }
.kpi:hover { border-color: var(--ink-3); }
.kpi .v { font-family: var(--font-d); font-weight: 700; font-size: 2rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .84rem; color: var(--ink-2); font-weight: 600; }
.kpi .d { font-size: .76rem; color: var(--ink-3); }
.kpi.vio .v { color: var(--vio); } .kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); } .kpi.info .v { color: var(--info); } .kpi.warn .v { color: var(--warn); }
.meter { display: block; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }

/* ---- tableaux ---- */
.tablewrap { overflow-x: auto; min-width: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.t th { text-align: left; font-family: var(--font-d); font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t tr.group td { background: var(--surface-2); font-family: var(--font-d); font-weight: 700; font-size: .9rem; letter-spacing: .03em; cursor: default; color: var(--ink-2); }
table.t td.c, table.t th.c { text-align: center; }
table.t td.r, table.t th.r { text-align: right; }
.equip { font-weight: 600; white-space: nowrap; }
.desig { min-width: 210px; }
.desig small { display: block; color: var(--ink-3); font-size: .76rem; }
.empty { padding: 28px 14px; text-align: center; color: var(--ink-3); }

/* ---- semaine ---- */
table.week td.day { text-align: center; min-width: 96px; padding: 5px 6px; }
table.t tr.trc td { background: color-mix(in srgb, var(--c) 9%, var(--surface)); }
table.t tr.trc:hover td { background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
table.t tr.trc td.equip, table.t tr.trc td.desig { color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
td.impact { min-width: 240px; max-width: 340px; color: var(--ink-2); line-height: 1.3; }
table.week td.small { white-space: nowrap; }
table.week td.impact { white-space: normal; }
table.week th.day { text-align: center; }
table.week th.day.today { color: var(--accent); }
.slot { display: inline-block; border-radius: 5px; padding: 3px 7px; font-family: var(--font-m); font-size: .76rem; font-weight: 600; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap; }
.slot.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.addslot { width: 100%; min-height: 28px; border: 1px dashed var(--line); background: none; border-radius: 5px; color: var(--ink-3); cursor: pointer; font-size: .9rem; }
.addslot:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.wk-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.load { font-family: var(--font-m); font-size: .7rem; color: var(--ink-3); text-transform: none; letter-spacing: 0; }
.addslot.out { opacity: .45; }
table.planner { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: .85rem; }
table.planner th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 2px 4px; white-space: nowrap; }
table.planner th.pday { font-family: var(--font-m); font-size: .8rem; }
table.planner th.pday small { display: block; font-family: var(--font-b); }
table.planner tr.focus th.pday { color: var(--accent); }
.warnt { color: var(--warn); font-weight: 600; font-size: .7rem; }
.pcell { width: 100%; min-width: 96px; min-height: 42px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--ink); }
.pcell b { font-family: var(--font-m); font-size: .85rem; }
.pcell span { font-size: .7rem; }
.pcell:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.pcell.free { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.pcell.busy, .pcell.conf { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pcell.full, .pcell.blk { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
table.planner tr.focus .pcell { box-shadow: 0 0 0 2px var(--accent); }

/* ---- mois ---- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line-2); }
.cal .dow { font-family: var(--font-d); font-weight: 600; font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 8px; border-bottom: 1px solid var(--line-2); }
.cal .cell { min-height: 118px; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal .cell:nth-child(7n) { border-right: 0; }
.cal .cell.out { background: var(--surface-2); }
.cal .cell.out .dn { color: var(--ink-3); }
.cal .cell.today .dn { background: var(--accent); color: var(--accent-ink); }
.cal .dn { font-family: var(--font-m); font-size: .76rem; font-weight: 600; align-self: flex-start; border-radius: 4px; padding: 0 5px; }
.chip { display: flex; align-items: center; gap: 5px; font-size: .74rem; line-height: 1.25; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 11%, var(--surface)); border: 0; text-align: left; cursor: pointer; color: var(--ink); min-width: 0; width: 100%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip.real { background: var(--ok-bg); }
.chip.late { box-shadow: inset 2px 0 0 var(--bad); }
.chip .st { margin-left: auto; font-family: var(--font-m); font-size: .7rem; color: var(--ink-3); flex: none; }
.more { font-size: .74rem; color: var(--accent); background: none; border: 0; text-align: left; cursor: pointer; padding: 1px 5px; font-weight: 600; }
.agenda { display: none; }
@media (max-width: 760px) { .cal { display: none; } .agenda { display: flex; flex-direction: column; } }
.agenda .day { padding: 10px 14px; border-bottom: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 5px; }
.agenda .day h3 { font-size: .95rem; }

/* ---- année ---- */
table.heat { border-collapse: separate; border-spacing: 2px; font-size: .74rem; }
table.heat th { font-family: var(--font-m); font-weight: 500; color: var(--ink-3); padding: 2px; font-size: .68rem; }
table.heat th.rowh { text-align: left; font-family: var(--font-b); font-size: .8rem; color: var(--ink-2); padding-right: 8px; white-space: nowrap; font-weight: 600; }
table.heat td { width: 22px; min-width: 22px; height: 24px; border-radius: 3px; text-align: center; font-family: var(--font-m); font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--ink); font-size: .68rem; }
table.heat td.z { cursor: default; color: transparent; }
table.heat td.cur { outline: 2px solid var(--accent); outline-offset: -1px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); align-items: center; }

/* ---- paramètres ---- */

/* ---- modale & toasts ---- */

/* accueil : cercles à déplier */

.hm-disc { position: relative; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; color: var(--c);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--surface) 70%, var(--cb)) 0%, var(--cb) 70%);
  box-shadow: inset 0 0 0 5px var(--c), 0 10px 22px -12px color-mix(in srgb, var(--c) 70%, transparent), var(--shadow); transition: transform .15s, box-shadow .15s; }

.tone-ok { --c: var(--ok); --cb: var(--ok-bg); } .tone-bad { --c: var(--bad); --cb: var(--bad-bg); } .tone-warn { --c: var(--warn); --cb: var(--warn-bg); }
.tone-or { --c: var(--or); --cb: var(--or-bg); } .tone-vio { --c: var(--vio); --cb: var(--vio-bg); } .tone-info { --c: var(--info); --cb: var(--info-bg); } .tone-mute { --c: var(--ink-2); --cb: var(--mute-bg); }
.hm-panel { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 18px; padding: 12px 14px 14px; box-shadow: var(--shadow); animation: hmIn .18s ease-out; display: flex; flex-direction: column; gap: 10px; }

.nowrap { white-space: nowrap; }

/* ---------- intro d'ouverture (reprise de Suivi Trains) ---------- */

.intro-tagline { position: absolute; left: 50%; bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2; width: max-content; max-width: 92vw; text-align: center; font-family: var(--font-d); font-weight: 700; font-size: clamp(1rem, 2.6vw, 1.8rem); letter-spacing: .08em; line-height: 1.35; text-transform: uppercase; pointer-events: none; opacity: 0; visibility: hidden; }
@media (orientation: portrait) { .intro-tagline { bottom: auto; top: calc(50% + 28.125vw + 1.2rem); } }
.intro-tagline.is-on { opacity: 1; visibility: visible; }

@keyframes outroFadeIn { to { opacity: 1; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
"use strict";
/* ====== MOTEUR : dates, classement, import Excel, fusion, statuts ====== */
const CORE = (() => {
  const pad = (n) => String(n).padStart(2, '0');
  const DAY = 86400000;
  const isoFromUTC = (t) => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const addDays = (iso, n) => isoFromUTC(parseISO(iso) + n * DAY);
  const addMonths = (iso, n) => {
    const [y, m, d] = iso.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + n, 1));
    const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(Math.min(d, last))}`;
  };
  const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / DAY); // a - b
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

  function toISO(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') {
      if (v > 20000 && v < 80000) return isoFromUTC(Math.floor(v + 1e-7) * DAY - 25569 * DAY);
      return null;
    }
    if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
    if (m) { let y = m[3]; if (y.length === 2) y = '20' + y; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
    return null;
  }
  const isDateSerial = (v) => typeof v === 'number' && v > 20000 && v < 80000;

  function isoWeek(iso) {
    const t = parseISO(iso);
    const day = (new Date(t).getUTCDay() + 6) % 7;
    const th = t + (3 - day) * DAY;
    const y = new Date(th).getUTCFullYear();
    const jan4 = Date.UTC(y, 0, 4);
    const w1 = jan4 - ((new Date(jan4).getUTCDay() + 6) % 7) * DAY;
    return { year: y, week: 1 + Math.floor((th - w1) / (7 * DAY)) };
  }
  const mondayOf = (iso) => { const t = parseISO(iso); return isoFromUTC(t - ((new Date(t).getUTCDay() + 6) % 7) * DAY); };
  function weekMonday(year, week) {
    const jan4 = Date.UTC(year, 0, 4);
    return isoFromUTC(jan4 - ((new Date(jan4).getUTCDay() + 6) % 7) * DAY + (week - 1) * 7 * DAY);
  }
  const weeksInYear = (y) => isoWeek(`${y}-12-28`).week;

  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  function hash(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }

  const DEFAULT_TYPES = [
    { id: 'ADV', label: 'Aiguilles (ADV)', color: '#2563eb' },
    { id: 'GRAISSAGE', label: 'Graissage', color: '#ca8a04' },
    { id: 'JGP', label: 'JGP', color: '#0d9488' },
    { id: 'CDV', label: 'Circuits de voie', color: '#4f46e5' },
    { id: 'SIGNAL', label: 'Signaux / carré violet', color: '#7c3aed' },
    { id: 'HEURTOIR', label: 'Feux de heurtoir', color: '#db2777' },
    { id: 'CENTRE', label: 'Centres poste', color: '#0891b2' },
    { id: 'PN', label: 'Passages à niveau', color: '#ea580c' },
    { id: 'VOIE', label: 'Voie et tournées', color: '#65a30d' },
    { id: 'CATENAIRE', label: 'Caténaire', color: '#a16207' },
    { id: 'AUTRE', label: 'Autres travaux', color: '#64748b' },
  ];

  function classify(des, code, app) {
    const d = norm(des), c = String(code || '').toUpperCase(), a = norm(app);
    const all = `${d} ${a}`;
    if (/graissage/.test(d) && !/jgp/.test(d)) return 'GRAISSAGE';
    if (/jgp/.test(all)) return 'JGP';
    if (/heurtoir/.test(d)) return 'HEURTOIR';
    if (/circuit de voie/.test(d) || /-CDV\b/.test(c)) return 'CDV';
    if (/maintenance centre|centre poste|centres poste/.test(all) || /-CEN\b/.test(c)) return 'CENTRE';
    if (/\bpn\b|passage a niveau|traversee routiere|maintenance tr\b/.test(d) || /-PNV\b/.test(c)) return 'PN';
    if (/signal|repetiteur|commutateur|carre|violet/.test(d)) return 'SIGNAL';
    if (/catenaire/.test(all)) return 'CATENAIRE';
    if (/\badv\b|aiguill/.test(all)) return 'ADV';
    if (/releve des ad|\blrs\b|geometrie|tournee|rails|\bvoie\b|nivellement/.test(d)) return 'VOIE';
    if (/-VDF\b|-VLI\b/.test(c)) return 'SIGNAL';
    if (/-ADV\b/.test(c)) return 'ADV';
    return 'AUTRE';
  }

  function equipFromCode(code) {
    if (!code) return '';
    const c = String(code).trim();
    const m = c.match(/^3HMCM(?:-EFE)?(?:-([A-Z]+))?(?:-(.+))?$/i);
    if (!m) return c;
    const fam = (m[1] || '').toUpperCase(), rest = (m[2] || '').trim();
    if (!rest) return fam === 'ADV' ? 'Tous ADV' : 'Site';
    if (fam === 'ADV') return 'ADV ' + rest;
    if (fam === 'CDV') return 'CDV ' + rest;
    if (fam === 'PNV') return rest.replace(/^TR\s*/i, 'PN ');
    return rest;
  }
  function equipKeys(label) {
    const s = String(label || '').toUpperCase().replace(/\b(ADV|CDV|CV|PN|ZEP|TOUS|SITE|JGP|ET|TR)\b[\s-]*/g, ' ');
    return s.split(/[\s&,;+]+/).map((t) => t.trim()).filter((t) => /\d/.test(t));
  }
  const normCode = (c) => String(c || '').toUpperCase().replace(/\s+/g, '');

  /* ---------- Lecture d'un classeur ---------- */
  const SYN = {
    ordre: ['ordre', 'n° ordre', 'no ordre', 'numero ordre', 'ot', 'n° ot'],
    priorite: ['priorite'],
    debut: ['date debut plf', 'date debut', 'debut planifie', 'debut planif', 'debut'],
    fin: ['fin planifiee', 'date prevue', 'echeance', 'date fin', 'fin planif', 'date limite'],
    designation: ['designation', 'nature des travaux', 'nature', 'operation', 'tache', 'libelle'],
    poste: ['poste technique', 'code', 'poste tech'],
    appareil: ['appareil', 'appareils', 'equipement'],
    description: ['description', 'commentaire', 'observation'],
    prog: ['date programmee', 'date programmation', 'programme le'],
    real: ['date realisee', 'date realisation', 'date controle', 'realise le', 'date execution'],
    zone: ['zone'],
    faisceau: ['faisceau'],
    demandeur: ['demandeur', 'mainteneur'],
    dem: ['date demande', 'date de demande', 'demande le', 'recue le', 'date reception'],
  };
  function mapHeader(row) {
    const map = {};
    row.forEach((cell, i) => {
      const n = norm(cell);
      if (!n) return;
      for (const [k, list] of Object.entries(SYN)) {
        if (map[k] !== undefined) continue;
        if (list.some((s) => n === s || (s.length > 4 && n.startsWith(s)))) { map[k] = i; break; }
      }
    });
    return map;
  }
  const str = (v) => (v === null || v === undefined ? '' : String(v).trim());
  function slotText(v) {
    if (typeof v === 'number' && v > 0 && v < 1) { const m = Math.round(v * 1440); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; }
    return str(v);
  }

  function parseWorkbook(XLSX, wb) {
    const recs = [], report = { sheets: [], plan: 0, prog: 0, real: 0 };
    let refs = null;
    for (const name of wb.SheetNames) {
      const ws = wb.Sheets[name];
      if (!ws || !ws['!ref']) continue;
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
      if (!rows.length) continue;
      const nn = norm(name);
      // 1. Feuille hebdomadaire S1..S53
      if (/^s\d{1,2}$/.test(nn)) {
        const hi = rows.findIndex((r, i) => i < 10 && r.some((c) => norm(c) === 'nature des travaux'));
        if (hi >= 0) { const n = parseWeekly(rows, hi, name, recs); if (n) report.sheets.push({ name, kind: 'Programmation', n }); report.prog += n; }
        continue;
      }
      // 2. Référentiel (feuille Données)
      if (nn === 'donnees') { const full = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true }); refs = parseRefs(rows); refs.form = parseForm(full); report.sheets.push({ name, kind: 'Référentiel', n: Object.values(refs).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0) }); continue; }
      // 3. Feuille STATS (réalisations)
      const statsHi = rows.findIndex((r, i) => i < 5 && r.some((c) => norm(c) === 'appareil') && r.some((c) => norm(c).startsWith('date controle')));
      if (statsHi >= 0) { const n = parseStats(rows, statsHi, recs); if (n) report.sheets.push({ name, kind: 'Réalisations', n }); report.real += n; continue; }
      // 4. Tableau générique avec en-têtes (PDM, export GMAO…)
      let hi = -1, map = null;
      for (let i = 0; i < Math.min(10, rows.length); i++) {
        const m = mapHeader(rows[i]);
        if (m.designation !== undefined && (m.fin !== undefined || m.debut !== undefined || m.real !== undefined || m.prog !== undefined)) { hi = i; map = m; break; }
      }
      if (hi >= 0) { const r = parseTable(rows, hi, map, recs); if (r.n) report.sheets.push({ name, kind: r.kind, n: r.n }); report.plan += r.plan; report.prog += r.prog; report.real += r.real; continue; }
      // 5. Liste sans en-tête : date | désignation | poste technique
      const sample = rows.slice(0, 20);
      const ok = sample.filter((r) => toISO(r[0]) && typeof r[1] === 'string' && r[1].trim()).length;
      if (sample.length >= 3 && ok / sample.length >= 0.7) {
        let n = 0;
        for (const r of rows) {
          const fin = toISO(r[0]); const des = str(r[1]);
          if (!fin || !des) continue;
          const code = str(r[2]);
          recs.push({ kind: 'plan', fin, designation: des, code, equip: equipFromCode(code), type: classify(des, code) });
          n++;
        }
        if (n) report.sheets.push({ name, kind: 'Plan (liste)', n }); report.plan += n;
      }
    }
    return { recs, refs, report };
  }

  function parseWeekly(rows, hi, sheetName, recs) {
    const H = rows[hi].map(norm);
    const col = (pred) => H.findIndex(pred);
    const cF0 = col((h) => h === 'faisceau'), cF = cF0 >= 0 ? cF0 : 0, cZ = col((h) => h === 'zone'), cA = col((h) => h.startsWith('appareil'));
    const cN = col((h) => h === 'nature des travaux'), cC = col((h) => h === 'code');
    const cCons = col((h) => h.startsWith('consignation')), cDem = col((h) => h === 'demandeur');
    const cDD = col((h) => h.startsWith('date demande')), cDV = col((h) => h.includes('validation')), cCom = col((h) => h.startsWith('commentaire'));
    const dayCols = [];
    rows[hi].forEach((c, i) => { if (isDateSerial(c) || (c instanceof Date)) dayCols.push({ i, date: toISO(c) }); });
    if (!dayCols.length) return 0;
    let fais = '', n = 0;
    const zoneMap = new Map();
    for (let r = hi + 1; r < rows.length; r++) { const row = rows[r]; if (cF >= 0 && str(row[cF])) fais = str(row[cF]); const z = norm(row[cZ]); if (z && fais && !str(row[cA]) && !str(row[cN])) zoneMap.set(z, fais); }
    fais = '';
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r];
      if (str(row[cF]) && !isDateSerial(row[cF])) fais = str(row[cF]);
      if (dayCols.every((d) => isDateSerial(row[d.i]))) continue; // ligne de pied (dates)
      const app = str(row[cA]), nat = str(row[cN]), code = str(row[cC]);
      if (!app && !nat && !code) continue;
      const slots = [];
      for (const d of dayCols) { const v = row[d.i]; if (v !== null && v !== '' && !isDateSerial(v)) slots.push({ date: d.date, h: slotText(v) }); }

/* ---------- statistiques ---------- */
function computeStats(ts, T) {

  const by = {}; STATUS_ORDER.forEach((k) => (by[k] = 0));
  act.forEach((t) => by[stOf(t, T)]++);
  const isReal = (t) => !!(t.real && t.real.date);
  const real = act.filter(isReal);
  const theo = act.filter((t) => t.fin);
  const due = theo.filter((t) => t.fin < T);
  const dueDone = due.filter(isReal).length;
  const dueNoDem = due.filter((t) => !isReal(t) && !hasDem(t)).length;
  const dems = act.filter(hasDem);
  const plan = act.filter((t) => t.prog && t.prog.date);
  const ecs = real.map((t) => C.ecart(t)).filter((e) => e !== null && Math.abs(e) <= 300);
  const avg = (l) => (l.length ? l.reduce((a, b) => a + b, 0) / l.length : null);
  const med = (l) => { if (!l.length) return null; const a = [...l].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const cats = { avance: 0, delai: 0, retard: 0, grave: 0 };
  real.forEach((t) => { const c = C.ecartCat(t, s); if (c) cats[c]++; });
  const ratio = (a, b) => ({ n: a, d: b, p: b ? a / b : null });
  const planTheo = plan.filter((t) => t.fin);
  const realTheo = real.filter((t) => t.fin && Math.abs(C.ecart(t)) <= 300);
  const realPlan = real.filter((t) => t.prog && t.prog.date);
  const traite = act.map((t) => { const d = demOf(t); return d && d.recue && t.prog && t.prog.planifieLe ? C.diffDays(t.prog.planifieLe, d.recue) : null; }).filter((v) => v !== null && v >= 0 && v < 365);
  return {
    total: act.length, by, theo: theo.length, horsGmao: act.length - theo.length, dems: dems.length, plan: plan.length, realises: real.length,
    due: due.length, dueDone, dueNoDem, taux: due.length ? dueDone / due.length : null,
    nonReal: due.length - dueDone, aPlanifier: by.demande + by.aReprogrammer,
    ecMed: med(ecs), ecMoy: avg(ecs), cats, lateReal: cats.retard + cats.grave,
    aVenir: plan.filter((t) => t.prog.date >= T && !isReal(t)).length, aEchoir: theo.filter((t) => t.fin >= T && !isReal(t)).length,
    demTheo: ratio(theo.filter(hasDem).length, theo.length),
    planDansFenetre: ratio(planTheo.filter((t) => t.prog.date <= t.fin).length, planTheo.length),
    realDansFenetre: ratio(realTheo.filter((t) => t.real.date <= t.fin).length, realTheo.length),
    respectPlan: ratio(realPlan.filter((t) => progDates(t).includes(t.real.date)).length, realPlan.length),
    traiteMoy: avg(traite), traiteN: traite.length,

}
function monthly(ts, y) {
  const rows = Array.from({ length: 12 }, () => ({ prevu: 0, dem: 0, prog: 0, real: 0, nonReal: 0, ecs: [] }));
  const T = today(); const mi = (d) => +d.slice(5, 7) - 1;
  for (const t of ts) {
    if (t.annule) continue;
    if (t.fin && t.fin.startsWith(y)) { rows[mi(t.fin)].prevu++; if (t.fin < T && !(t.real && t.real.date)) rows[mi(t.fin)].nonReal++; }
    const d = demOf(t); if (d && d.recue && d.recue.startsWith(y)) rows[mi(d.recue)].dem++;
    if (t.prog && t.prog.date && t.prog.date.startsWith(y)) rows[mi(t.prog.date)].prog++;
    if (t.real && t.real.date && t.real.date.startsWith(y)) { const m = mi(t.real.date); rows[m].real++; const e = C.ecart(t); if (e !== null && Math.abs(e) <= 300) rows[m].ecs.push(e); }

function chartMonthly(rows) {

    const pts = list.map((t) => { const r = t.real && t.real.date; const d = base === 'reel' ? r : base === 'theo' ? t.fin : (r || t.fin); return d ? { d, real: !!r, t } : null; }).filter(Boolean).sort((a, b) => a.d.localeCompare(b.d));

    const open = list.filter((t) => !(t.real && t.real.date) && t.fin).sort((a, b) => a.fin.localeCompare(b.fin));

  }

function chartBars(buckets, series) {
  const W = 920, H = 230, L = 34, R = 8, Tp = 12, B = 26; const n = buckets.length || 1;
  const max = niceMax(Math.max(1, ...series.flatMap((sr) => sr.values)));
  const cw = (W - L - R) / n, gap = 1.5, bw = Math.max(3, Math.min(14, (cw - 8 - gap * (series.length - 1)) / series.length));
  const y = (v) => Tp + (H - Tp - B) * (1 - v / max); const nd = max === 4 ? 4 : 5; let g = '';
  for (let i = 0; i <= nd; i++) { const v = (max / nd) * i; const yy = y(v); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3.5}" text-anchor="end">${fmtNum(v, 0)}</text>`; }
  buckets.forEach((bk, i) => {

    series.forEach((sr, j) => { const v = sr.values[i]; const yy = y(v); const h = Math.max(0, H - B - yy); g += `<rect x="${x0 + j * (bw + gap)}" y="${yy}" width="${bw}" height="${h}" rx="2" fill="${sr.color}"><title>${esc(bk.label)} : ${v} ${esc(sr.label)}</title></rect>`; });
    if (n <= 31 || i % Math.ceil(n / 26) === 0) g += `<text x="${L + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${esc(bk.label)}</text>`;

/* ---------- vue : année ---------- */

/* ---------- vue : tâches ---------- */

/* ---------- vue : équipements ---------- */
function gammeFor(t) { return S.settings.gammes.find((g) => g.actif !== false && g.match && C.norm(t.designation).includes(C.norm(g.match))); }
const gammeTxt = (g) => (!g ? '—' : g.unite === 'demande' ? 'à la demande' : `${g.periode} ${g.unite}`);
const gammeDays = (g) => (!g || g.unite === 'demande' ? null : g.unite === 'mois' ? Math.round(g.periode * 30.44) : g.unite === 'semaines' ? g.periode * 7 : g.periode);
function viewEquip() {
  if (!S.tasks.size) return head('Équipements') + emptyData();
  const T = today(), q = C.norm(S.ui.equipQ), Y = String(S.ui.year);
  const groups = new Map();
  for (const t of S.tasks.values()) {
    if (t.annule) continue;
    if (S.ui.equipType && t.type !== S.ui.equipType) continue;
    const key = t.type + '|' + (t.equip || 'Général') + '|' + C.norm(t.designation);
    if (!groups.has(key)) groups.set(key, []); groups.get(key).push(t);
  }
  let rows = [...groups.values()].map((list) => {
    const t0 = list[0]; const reals = list.filter((t) => t.real && t.real.date).map((t) => t.real.date).sort(); const fins = list.filter((t) => t.fin).map((t) => t.fin).sort();
    const iv = (arr) => (arr.length > 1 ? arr.slice(1).reduce((a, d, i) => a + C.diffDays(d, arr[i]), 0) / (arr.length - 1) : null);
    const lastReal = reals[reals.length - 1] || null; const g = gammeFor(t0); const gd = gammeDays(g);
    const pending = list.filter((t) => !(t.real && t.real.date) && t.fin).sort((a, b) => a.fin.localeCompare(b.fin));
    const next = pending[0] || null; const ivR = iv(reals);
    const yPlan = list.filter((t) => (t.fin || '').startsWith(Y)).length, yReal = list.filter((t) => t.real && (t.real.date || '').startsWith(Y)).length;
    const expected = gd ? Math.max(1, Math.round(365 / gd)) : null;
    return { t0, list, yPlan, yReal, expected, nReal: reals.length, nPrev: fins.length, lastReal, since: lastReal ? C.diffDays(T, lastReal) : null, ivR, ivP: iv(fins), g, gd, next, ecartIv: ivR !== null && gd ? Math.round(ivR - gd) : null, overdueSince: lastReal && gd ? C.diffDays(T, lastReal) - gd : null };
  });
  if (q) rows = rows.filter((r) => C.norm([r.t0.equip, r.t0.designation, r.t0.code].join(' ')).includes(q));
  rows.sort((a, b) => typeRank(a.t0.type) - typeRank(b.t0.type) || (a.t0.equip || '').localeCompare(b.t0.equip || '', 'fr', { numeric: true }) || a.t0.designation.localeCompare(b.t0.designation));
  let body = '', lastT = null;
  for (const r of rows) {
    if (r.t0.type !== lastT) { body += `<tr class="group"><td colspan="9"><span class="tcell">${plate(r.t0.type)}${esc(typeOf(r.t0.type).label)}</span></td></tr>`; lastT = r.t0.type; }
    const late = r.overdueSince !== null && r.overdueSince > 0;
    body += `<tr data-act="equipdetail" data-k="${esc(r.t0.type + '|' + (r.t0.equip || 'Général') + '|' + C.norm(r.t0.designation))}"><td class="equip">${esc(r.t0.equip || 'Général')}</td><td class="desig">${esc(r.t0.designation)}</td>
      <td class="r"><span class="mono">${r.yReal} / ${r.yPlan}</span>${r.expected && r.yPlan < r.expected ? ` <span class="pill warn" title="Périodicité ${esc(gammeTxt(r.g))} : ${r.expected} contrôles attendus par an">${r.yPlan} prévu${r.yPlan > 1 ? 's' : ''} sur ${r.expected}</span>` : ''}</td><td class="mono small">${fmtD(r.lastReal)}</td><td class="r mono">${r.since === null ? '—' : r.since + ' j'}</td>
      <td class="r mono">${gammeTxt(r.g)}</td><td class="r mono">${r.ivR === null ? (r.ivP === null ? '—' : `<span class="muted" title="intervalle entre échéances prévues">${Math.round(r.ivP)} j prévu</span>`) : Math.round(r.ivR) + ' j'}</td>
      <td class="r"><span class="ecart ${r.ecartIv === null ? '' : r.ecartIv > 0 ? (r.ecartIv > S.settings.seuilGrave ? 'grave' : 'retard') : 'delai'}">${r.ecartIv === null ? (late ? `<span class="ecart grave" title="dépassement de la périodicité depuis la dernière visite">+${r.overdueSince} j</span>` : '') : signed(r.ecartIv)}</span></td>
      <td>${r.next ? `<span class="mono small">${fmtD(r.next.fin)}</span> ${pill(r.next, T)}` : '<span class="muted small">—</span>'}</td></tr>`;
  }

    `${yearSelect('equipYear')}<input type="search" id="eq" data-act-input="equipq" placeholder="Rechercher un appareil" value="${esc(S.ui.equipQ)}" style="width:220px"><select id="eqType" data-act-change="equiptype" style="width:auto">${optList(S.settings.types.map((t) => [t.id, t.label]), S.ui.equipType, 'Toutes familles')}</select>`) +
  `<section class="panel"><div class="tablewrap"><table class="t"><thead><tr><th>Appareil</th><th>Opération</th><th class="r">${S.ui.year} : réalisés / prévus</th><th>Dernière visite</th><th class="r">Depuis</th><th class="r">Périodicité</th><th class="r">Intervalle réel</th><th class="r">Écart</th><th>Prochaine échéance</th></tr></thead>
  <tbody>${body || '<tr><td colspan="9" class="empty">Aucun équipement.</td></tr>'}</tbody></table></div></section>
  <p class="muted small">Intervalle réel : moyenne des jours entre deux réalisations. Écart : intervalle réel moins la périodicité de la gamme (positif = visites trop espacées). Les périodicités se règlent dans Paramètres › Gammes.</p>`;
}

/* ---------- intro d'ouverture (vidéo LHTE, comme Suivi Trains) et fermeture « Terminé » ---------- */
const INTRO_SOUND_KEY = 'planmaint:introMuted';
const INTRO_TAGLINE_AT_S = 3.6, INTRO_END_HOLD_MS = 600, INTRO_START_TIMEOUT_MS = 2500, OUTRO_MS = 3000;
// Dégradé du slogan aux couleurs des familles : ADV bleu, JGP sarcelle, signaux violet, PN orange, caténaire or.
const INTRO_COLORS = ['#60a5fa', '#2dd4bf', '#a78bfa', '#fb923c', '#facc15'];
const readMuted = () => { try { return localStorage.getItem(INTRO_SOUND_KEY) === '1'; } catch (e) { return false; } };
const writeMuted = (m) => { try { localStorage.setItem(INTRO_SOUND_KEY, m ? '1' : '0'); } catch (e) { /* ignoré */ } };
function mixHex(a, b, t) { const pa = a.match(/\w\w/g).map((h) => parseInt(h, 16)); const pb = b.match(/\w\w/g).map((h) => parseInt(h, 16)); return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function buildTagline(box) {
  const text = box.textContent.trim(); const n = text.replace(/\s+/g, '').length; let k = 0;
  const colorAt = (i) => { const pos = n > 1 ? (i / (n - 1)) * (INTRO_COLORS.length - 1) : 0; const j = Math.min(Math.floor(pos), INTRO_COLORS.length - 2); return mixHex(INTRO_COLORS[j], INTRO_COLORS[j + 1], pos - j); };
  box.innerHTML = `<span class="intro-tagline-text">${text.split(/\s+/).map((w) => `<span class="intro-tagline-word">${[...w].map((ch) => { const i = k++; return `<span class="intro-tagline-char" style="--c:${colorAt(i)};--d:${(i * 0.022 + (i % 3) * 0.04).toFixed(3)}s;--b:${(((i * 7) % 11) / 5).toFixed(2)}s">${esc(ch)}</span>`; }).join('')}</span>`).join(' ')}</span><span class="intro-tagline-spark"></span>`;
}
function playIntro() {
  const sp = document.getElementById('introSplash'); if (!sp) return;
  const video = document.getElementById('introVideo'), soundBtn = document.getElementById('introSoundBtn'), skipBtn = document.getElementById('introSkipBtn'), tag = document.getElementById('introTagline');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !video || typeof video.play !== 'function') { if (video) video.removeAttribute('src'); sp.remove(); return; }
  document.body.classList.add('intro-active'); if (tag) buildTagline(tag);
  let done = false, safety = null;
  const upd = () => { if (!soundBtn) return; soundBtn.hidden = false; soundBtn.textContent = video.muted ? '🔊 Activer le son' : '🔇 Couper le son'; };
  const dismiss = () => {
    if (done) return; done = true; clearTimeout(safety);
    sp.classList.add('is-leaving'); document.body.classList.remove('intro-active');
    const v0 = video.volume, t0 = performance.now();
    const fade = (now) => { const k = Math.min(1, (now - t0) / 450); try { video.volume = v0 * (1 - k); } catch (e) { /* iOS */ } if (k < 1 && sp.isConnected) requestAnimationFrame(fade); };
    requestAnimationFrame(fade);

    sp.addEventListener('transitionend', clean, { once: true }); setTimeout(clean, 700);
  };
  sp.addEventListener('click', dismiss);
  sp.addEventListener('keydown', (e) => { if (['Escape', 'Enter', ' '].includes(e.key)) dismiss(); });
  if (skipBtn) skipBtn.addEventListener('click', (e) => { e.stopPropagation(); dismiss(); });
  if (soundBtn) soundBtn.addEventListener('click', (e) => { e.stopPropagation(); video.muted = !video.muted; writeMuted(video.muted); if (video.paused) video.play().catch(() => {}); upd(); });

}
function outroChime() {
  if (readMuted()) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); const now = ctx.currentTime; const master = ctx.createGain(); master.gain.value = 0.16; master.connect(ctx.destination);
    [146.83, 220, 293.66, 369.99].forEach((f) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.22, now + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, now + 3); o.connect(g).connect(master); o.start(now); o.stop(now + 3.05); });
    [[880, 0.45], [739.99, 0.8], [587.33, 1.15], [440, 1.6]].forEach(([f, t]) => [[f, 0.5], [f * 2.01, 0.12]].forEach(([fq, a]) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = fq; const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(a, now + t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 1.3); o.connect(g).connect(master); o.start(now + t); o.stop(now + t + 1.35); }));
    setTimeout(() => ctx.close().catch(() => {}), 3600);
  } catch (e) { /* son indisponible */ }
}

  return [r.saved ? '✓ Données sauvegardées' : '✗ Sauvegarde à vérifier', r.json === null ? null : r.json ? '✓ Sauvegarde .json téléchargée' : '✗ Sauvegarde .json non téléchargée', r.pdf === null ? null : r.pdf ? '✓ PDF du programme' : '✗ PDF non généré'].filter(Boolean);
}
function playOutro(r) {
  return new Promise((resolve) => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ov = document.createElement('div'); ov.className = 'outro'; ov.setAttribute('role', 'presentation');
    ov.innerHTML = `<div class="outro-stage"><video class="outro-video" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback src="assets/lhte-intro-v2.mp4"></video><div class="outro-fallback-logo" hidden>LHTE</div>
      <div class="outro-text"><div class="outro-title">Planning sauvegardé</div><div class="outro-sub">${esc(fmtLong(today()))} · ${esc(endLines(r).join(' · '))}</div></div><div class="outro-sweep" aria-hidden="true"></div></div><div class="outro-dot" aria-hidden="true"></div>`;
    document.body.appendChild(ov); document.body.classList.add('intro-active'); buildTagline(ov.querySelector('.outro-title'));
    const v = ov.querySelector('.outro-video'); const fb = () => { v.hidden = true; ov.querySelector('.outro-fallback-logo').hidden = false; };
    v.addEventListener('error', fb);
    const start = () => { try { v.currentTime = 5; } catch (e) { /* ignoré */ } v.play().catch(fb); };
    if (v.readyState >= 1) start(); else v.addEventListener('loadedmetadata', start, { once: true });
    if (reduce) { ov.classList.add('is-static'); setTimeout(() => resolve(ov), 800); return; }
    outroChime(); requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('is-playing')));
    setTimeout(() => resolve(ov), OUTRO_MS);
  });
}
function showEndScreen(ov, r) {
  const t = ov || document.body.appendChild(document.createElement('div')); const now = new Date();
  t.className = 'outro is-ended';
  t.innerHTML = `<div class="outro-end"><div class="outro-end-mark" aria-hidden="true">✔</div><h1 class="outro-end-title">Session terminée</h1><p class="outro-end-date">${esc(fmtLong(today()))} · fermée à ${C.pad(now.getHours())}:${C.pad(now.getMinutes())}</p>
    <ul class="outro-end-list">${endLines(r).map((l) => `<li>${esc(l)}</li>`).join('')}</ul><p class="outro-end-hint">Vous pouvez fermer l’application. Bonne journée !</p><button type="button" class="btn primary" id="reopenApp">↺ Rouvrir l’application</button></div>`;
  t.querySelector('#reopenApp').addEventListener('click', () => location.reload());
}
Object.assign(ACT, { endsession: () => openEnd(), endrun: () => runEnd() });
playIntro();

document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]'); if (v) { go(v.dataset.view); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (fn) fn(a.dataset, a, e);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.actChange && CHANGE[el.dataset.actChange]) { CHANGE[el.dataset.actChange](el); return; }
  if (el.dataset.f !== undefined && el.tagName === 'SELECT') { S.ui.filters[el.dataset.f] = el.value; S.ui.sel.clear(); render(); return; }
  if (el.dataset.g !== undefined) { const g = S.settings.gammes[+el.dataset.g]; const k = el.dataset.k; g[k] = el.type === 'checkbox' ? el.checked : (k === 'periode' || k === 'fenetre') ? Math.max(0, +el.value || 0) : el.value.trim(); store.saveSettings(); return; }
  if (el.dataset.cr !== undefined) { const c = S.settings.creneauxStd[+el.dataset.cr]; c[el.dataset.k] = el.dataset.k === 'cap' ? Math.max(1, +el.value || 1) : el.value.trim(); store.saveSettings(); return; }
  if (el.dataset.type !== undefined) { S.settings.types[+el.dataset.type][el.dataset.k] = el.value; store.saveSettings(); return; }
  if (el.dataset.s !== undefined) { const k = el.dataset.s; S.settings[k] = k === 'showSunday' ? el.value === 'true' : ['seuilGrave', 'tolerance', 'alerte', 'tolInterv'].includes(k) ? Math.max(0, +el.value || 0) : el.value.trim(); store.saveSettings(); }
});
let qTimer = 0;
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.f === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.ui.filters.q = el.value; S.ui.sel.clear(); render(); }, 180); }
  if (el.closest && el.closest('#demForm')) demFormInput(el);
  if (RC && el.classList) {
    if (el.classList.contains('rc-on')) { const u = RC.units[+el.dataset.i]; u.on = el.checked; if (u.on && !u.slots.length) proposeUnit(u); renderRc(); }
    if (el.classList.contains('rc-day')) { const u = RC.units[+el.dataset.i]; const d = +el.dataset.d; u.sel = el.checked ? [...new Set([...u.sel, d])].sort() : u.sel.filter((x) => x !== d); proposeUnit(u); renderRc(); }
    if (el.classList.contains('rc-deb') && el.value) { RC.units[+el.dataset.i].slots[+el.dataset.k].deb = el.value; renderRc(); }
    if (el.id === 'rc-alldays' && RC.lines.length) { RC.allDays = el.checked; buildUnits(); proposeAll(); renderRc(); }
    if (el.id === 'rc-perzep' && RC.lines.length) { RC.perZep = el.checked; buildUnits(); proposeAll(); renderRc(); }
    if (el.id === 'rc-year' && RC.lines.length) { RC.year = +el.value; RC.lines.forEach((l) => (l.year = RC.year)); buildUnits(); proposeAll(); renderRc(); }
  }
  if (el.closest && el.closest('.srow')) { const r = el.closest('.srow'); const a = fromHHMM(r.querySelector('.s-deb').value), b = fromHHMM(r.querySelector('.s-fin').value); r.querySelector('.s-dur').textContent = a !== null && b !== null ? fmtDur((b - a + 1440) % 1440) : ''; }
  if (el.dataset.actInput === 'stq') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.ui.st.q = el.value; render(); }, 180); }
  if (el.dataset.actInput === 'equipq') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.ui.equipQ = el.value; render(); }, 180); }
});
function demFormInput(el) {
  if (el.classList.contains('auto')) el.classList.remove('auto');
  if (el.dataset.pick) { const tx = document.getElementById(el.id + '-txt'); if (tx) tx.hidden = el.value !== '__autre'; }
  if (el.id === 'd-cat') {
    const cat = catOf(el.value); DF.cat = el.value; DF.nature = ''; DF.apps = [];
    $('#d-code').value = cat ? cat.code : ''; $('#d-code').classList.toggle('auto', !!cat);
    $('#d-nat-box').innerHTML = natureSelect(); $('#d-app-box').innerHTML = appSelect(); $('#d-wag-l').hidden = true;
    $('#d-wagons-l').hidden = !isWagons(DF.nature) && catKey(DF.cat) !== 'PRESTATION LOCO';
    const list = appareilsFor(cat, DF.nature); if (list.length === 1) addApp(list[0]); else { renderApps(); applySuggest(); }
  }
  if (el.id === 'd-nat' || el.id === 'd-nat-txt') {
    DF.nature = el.id === 'd-nat' ? (el.value === '__autre' ? $('#d-nat-txt').value.trim() : el.value) : el.value.trim();
    $('#d-app-box').innerHTML = appSelect(); $('#d-wag-l').hidden = true; $('#d-wagons-l').hidden = !isWagons(DF.nature) && catKey(DF.cat) !== 'PRESTATION LOCO'; renderApps(); applySuggest();
  }
  if (el.id === 'd-wagons') {
    const list = extractWagons(el.value).map(identifyWagon); const groups = wagGroups(list);
    $('#d-wagons-info').innerHTML = list.length ? groups.map(([k, l]) => `<b>${l.length}</b> ${esc(k)}`).join(' · ') + (list.some((w) => w.valid === false) ? ` · <span style="color:var(--bad)">${list.filter((w) => w.valid === false).length} clé UIC fausse</span>` : '') : '';
    DF.apps = groups.map(([k, l]) => ({ equip: k === 'Non identifié' ? 'Wagons (entreprise inconnue)' : `Wagons ${k}`, wagons: l.map((w) => w.fmt), link: '' }));
    renderApps(); applySuggest();
  }
  if (el.id === 'd-app') {
    $('#d-app-txt').hidden = el.value !== '__autre';
    if (el.value && el.value !== '__autre') {
      if (isWagons(DF.nature)) { const nums = (FORM().wagons || {})[el.value] || []; $('#d-wag').innerHTML = `<option value="">— tous / sans n° —</option>${nums.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}`; $('#d-wag-l').hidden = false; }
      addApp(el.value);
    }
  }
  if (el.id === 'd-wag' && DF.apps.length) { const base = $('#d-app').value; const last = DF.apps[DF.apps.length - 1]; last.equip = el.value ? `${base} ${el.value}` : base; last.link = undefined; renderApps(); }
  if (el.classList.contains('d-link')) { DF.apps[+el.dataset.i].link = el.value; renderApps(); applySuggest(); }

  if (el.id === 'd-deb') timeChanged('deb'); if (el.id === 'd-fin') timeChanged('fin'); if (el.id === 'd-dur') timeChanged('dur');
  demCheck();
}
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset && el.dataset.zone && !el.closest('#demForm')) { const tx = document.getElementById(el.id + '-txt'); if (tx) tx.hidden = el.value !== '__autre'; if (el.id === 'p-zo') { const f = (S.settings.refs.zonesFaisceau || {})[el.value]; if (f) $('#p-fa').value = f; } } });
